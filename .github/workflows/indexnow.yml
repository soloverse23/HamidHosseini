name: IndexNow

# After each successful production deploy on Vercel, tell IndexNow engines
# (Bing, Yandex, …) which pages changed in the last two days.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/indexnow.mts
