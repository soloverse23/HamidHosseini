name: Sync content

# Pulls new posts from Telegram, YouTube, TikTok and Instagram, and new
# episodes of the Imam Ali Foundation playlists, about every 6 hours. Commits the
# data if anything changed and lets Vercel redeploy from that commit.
on:
  schedule:
    # GitHub delays scheduled runs by hours and drops some outright, so a 6-hourly
    # cron left 10-hour gaps. Firing hourly (off the :00 mark) gives it many chances;
    # the gate job below only lets a real sync through every ~6 hours.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-read the full history of every source'
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Newest successful run whose sync job actually ran (gated runs skip it).
          last=""
          for row in $(gh run list -R "$GITHUB_REPOSITORY" -w sync.yml -s success -L 30 \
                         --json databaseId,createdAt -q '.[] | "\(.databaseId),\(.createdAt)"'); do
            id=${row%,*}
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            ran=$(gh run view -R "$GITHUB_REPOSITORY" "$id" --json jobs -q '.jobs[] | select(.name == "sync") | .conclusion')
            if [ "$ran" = "success" ]; then last=${row#*,}; break; fi
          done
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "Last sync: ${last:-never} (${age}s ago)"
          if [ "$age" -ge 19800 ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi

  sync:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install yt-dlp
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o "$HOME/.local/bin/yt-dlp"
          chmod +x "$HOME/.local/bin/yt-dlp"

      - run: npm ci

      - name: Fetch all sources
        id: fetch
        continue-on-error: true
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: npx tsx scripts/fetch/all.ts ${{ inputs.full && '--full' || '' }}

      - name: Draw Quran share cards
        # Only for verses, surahs and roots whose text changed (scripts/og/quran.ts).
        # A failure here must not hold back the content; pages fall back to /og.png.
        continue-on-error: true
        run: |
          if [ "$(npx tsx scripts/og/quran.ts --pending)" != "0" ]; then
            npx playwright-core install --with-deps chromium
            npx tsx scripts/og/quran.ts
          fi

      - name: Commit changes
        run: |
          git config user.name "content-sync[bot]"
          git config user.email "content-sync@users.noreply.github.com"
          git add src/data public/media public/og
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "content: sync $(date -u +'%Y-%m-%d %H:%M') UTC"
            # main may have moved while the fetch ran; data files rarely conflict.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Report failures
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(cat .fetch-failures.txt 2>/dev/null || echo 'See the workflow log.')

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Cached content is still being served; nothing on the site was removed."
          gh label create sync-failure --color B60205 --description "Content sync failed" 2>/dev/null || true
          existing=$(gh issue list --label sync-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Content sync failing" --label sync-failure --body "$body"
          fi
